<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESP32 Display</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #14161a; --panel: #1d2026; --line: #2c313a; --text: #e6e8eb; --dim: #8b929c;
    --ok: #3ccf6e; --warn: #e8b23a; --bad: #e5534b; --accent: #4c8dff;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eceef1; --panel: #ffffff; --line: #d5d9df; --text: #1b1e23; --dim: #646b75; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); min-height: 46px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); flex: none; }
  .dot.open { background: var(--ok); } .dot.closed { background: var(--bad); }
  #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #conn { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #spacer { flex: 1; }
  #buttons { display: flex; gap: 8px; }
  #buttons button {
    font: inherit; font-weight: 600; min-width: 52px; padding: 6px 14px; cursor: pointer;
    color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  #buttons button:hover { border-color: var(--accent); }
  #buttons button:active { background: var(--accent); color: #fff; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  canvas {
    image-rendering: pixelated; background: #000; display: block;
    touch-action: none; user-select: none; -webkit-user-select: none;
    box-shadow: 0 0 0 1px var(--line), 0 8px 30px rgba(0,0,0,.35);
  }
  #msg {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; color: var(--dim); text-align: center; padding: 24px; pointer-events: none;
  }
  #msg form { pointer-events: auto; display: flex; gap: 8px; }
  #msg input {
    font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); width: 220px;
  }
  #msg button {
    font: inherit; padding: 6px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; cursor: pointer;
  }
  footer {
    padding: 4px 12px; color: var(--dim); font-size: 12px; border-top: 1px solid var(--line);
    background: var(--panel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  [hidden] { display: none !important; }
</style>
</head>

// END FONT_HEX
const FONT = new Uint8Array(1280);
for (let i = 0; i < 1280; i++) FONT[i] = parseInt(FONT_HEX.substr(i * 2, 2), 16);

// ESP32 -> display opcodes (GraphicsProtocol.h / GFXProtocol.swift)
const OP = {
  BEGIN: 0x01, FILL_SCREEN: 0x02, FLUSH: 0x03, SET_ROTATION: 0x05, INVERT: 0x06,
  CLOSE: 0x07, TITLE: 0x08, CLEAR_BUTTONS: 0x09, ADD_BUTTON: 0x0A,
  PIXEL: 0x10, LINE: 0x11, HLINE: 0x12, VLINE: 0x13,
  RECT: 0x20, FILL_RECT: 0x21, ROUNDRECT: 0x22, FILL_ROUNDRECT: 0x23,
  CIRCLE: 0x30, FILL_CIRCLE: 0x31, TRI: 0x32, FILL_TRI: 0x33,
  BITMAP: 0x40, BITMAP_BG: 0x41, BITMAP_FG: 0x42, RGB_BITMAP: 0x43, RGB_BITMAP_MASK: 0x44, GRAY_BITMAP: 0x45,
  CURSOR: 0x50, TEXT_COLOR: 0x51, TEXT_COLOR_BG: 0x52, TEXT_SIZE: 0x53, TEXT_WRAP: 0x54,
  CP437: 0x55, FONT: 0x56, WRITE_CHAR: 0x57, WRITE_UTF8: 0x58,
  TOUCH_BEGIN: 0x70, TOUCH_END: 0x71, TOUCH_DELAY: 0x72, PING: 0xF0
};
// display -> ESP32 back-channel commands (Protocol.h)
const BC = {
  PONG: 0xF1, KEY1: 0xF2, KEY2: 0xF3, REDRAW: 0xE0, AVAILABLE: 0xE1,
  TOUCH_DOWN: 0x10, TOUCH_MOVE: 0x11, TOUCH_UP: 0x12, Z_CONTACT: 128
};

const MAGIC = 0xA5;

// Frame: [0xA5][lenLo][lenHi][cmd][payload...], len = 1 + payload bytes, all little-endian.
function makeFrame(cmd, payload) {
  const n = payload ? payload.length : 0;
  const f = new Uint8Array(4 + n);
  f[0] = MAGIC; f[1] = (n + 1) & 255; f[2] = (n + 1) >> 8; f[3] = cmd;
  if (n) f.set(payload, 4);
  return f;
}

const u16 = (p, o) => p[o] | (p[o + 1] << 8);
const i16 = (p, o) => ((p[o] | (p[o + 1] << 8)) << 16) >> 16;
const idiv = (a, b) => (a / b) | 0;          // C integer division (truncates toward zero)

// RGB565 -> RGBA8888 exactly as the iPhone app does it: (v * 255) / max, integer division.
const LITTLE_ENDIAN = new Uint8Array(new Uint32Array([1]).buffer)[0] === 1;
function makeLut() {
  const lut = new Uint32Array(65536);
  for (let v = 0; v < 65536; v++) {
    const r = Math.floor((((v >> 11) & 31) * 255) / 31);
    const g = Math.floor((((v >> 5) & 63) * 255) / 63);
    const b = Math.floor(((v & 31) * 255) / 31);
    lut[v] = LITTLE_ENDIAN
      ? ((0xFF000000 | (b << 16) | (g << 8) | r) >>> 0)
      : (((r << 24) | (g << 16) | (b << 8) | 0xFF) >>> 0);
  }
  return lut;
}

// Byte-stream frame parser. WebSocket messages are NOT frame-aligned (a frame can
// straddle two messages), so this keeps a rolling buffer exactly like a TCP reader.
class FrameParser {
  constructor(onFrame, maxLen) {
    this.onFrame = onFrame;
    this.maxLen = maxLen || 16384;
    this.buf = new Uint8Array(8192);
    this.start = 0; this.end = 0;
    this.stats = { bytes: 0, frames: 0, syncErrors: 0, invalid: 0 };
  }
  reset() { this.start = this.end = 0; }
  feed(data) {
    this.stats.bytes += data.length;
    if (this.end + data.length > this.buf.length) {
      const live = this.end - this.start;
      if (live + data.length > this.buf.length) {
        const nb = new Uint8Array(Math.max(this.buf.length * 2, live + data.length));
        nb.set(this.buf.subarray(this.start, this.end));
        this.buf = nb;
      } else {
        this.buf.copyWithin(0, this.start, this.end);
      }
      this.start = 0; this.end = live;
    }
    this.buf.set(data, this.end);
    this.end += data.length;
    this._drain();
  }
  _drain() {
    const b = this.buf;
    while (this.end - this.start >= 3) {
      if (b[this.start] !== MAGIC) { this.start++; this.stats.syncErrors++; continue; }
      const len = b[this.start + 1] | (b[this.start + 2] << 8);
      if (len < 1 || len > this.maxLen) { this.start++; this.stats.invalid++; continue; }
      if (this.end - this.start < 3 + len) break;          // wait for the rest
      const cmd = b[this.start + 3];
      const payload = b.subarray(this.start + 4, this.start + 3 + len);
      this.start += 3 + len;
      this.stats.frames++;
      this.onFrame(cmd, payload);
    }
    if (this.start === this.end) this.start = this.end = 0;
  }
}

const MAX_PIXELS = 1 << 20;

class Renderer {
  // handlers: optional callbacks - begin, layout, flush, title, clearButtons, addButton,
  // touchBegin(mode,intervalMs), touchEnd, touchDelay(intervalMs), ping, close
  constructor(handlers) {
    this.hd = handlers || {};
    this.lut = null;
    this.stats = { bad: 0, unknown: 0 };
    this.W = this.H = this.w = this.h = 0;
    this.fb = new Uint16Array(0); this.snap = new Uint16Array(0);
    this.hasSnap = false; this.dirty = false;
    this.warnedFont = false;
    this._resetState();
  }
  _emit(name, a, b) { const f = this.hd[name]; if (f) f(a, b); }

  _resetState() {
    this.rot = 0; this.inv = 0;
    this.cx = 0; this.cy = 0;
    this.tsx = 1; this.tsy = 1;
    this.fg = 0xFFFF; this.bg = 0xFFFF;
    this.wrap = true; this.cp437 = false;
  }
  _layout() {
    const odd = this.rot & 1;
    this.w = odd ? this.H : this.W;     // logical (rotated) size, like Adafruit's _width/_height
    this.h = odd ? this.W : this.H;
  }
  get lw() { return this.w; }
  get lh() { return this.h; }

  // BEGIN = full reset: allocate surface, clear to black, reset all drawing state.
  begin(w, h) {
    if (w < 1 || h < 1 || w * h > MAX_PIXELS) { this.stats.bad++; return; }
    this.W = w; this.H = h;
    this.fb = new Uint16Array(w * h);
    this.snap = new Uint16Array(w * h);
    this.hasSnap = false;
    this._resetState();
    this._layout();
    this.dirty = true;
    this._emit('begin', w, h);
    this._emit('layout');
  }

  // Freeze the current framebuffer as the frame to present (called on FLUSH / idle gap).
  snapshot() {
    if (!this.fb.length) return;
    this.snap.set(this.fb);
    this.sW = this.W; this.sH = this.H; this.sRot = this.rot; this.sInv = this.inv;
    this.hasSnap = true; this.dirty = false;
  }
  snapSize() {
    const odd = this.sRot & 1;
    return { w: odd ? this.sH : this.sW, h: odd ? this.sW : this.sH };
  }
  // Convert the snapshot to RGBA (logical orientation) into a Uint32Array of w*h pixels.
  presentSnapshot(out) {
    if (!this.hasSnap) return;
    if (!this.lut) this.lut = makeLut();
    const lut = this.lut, s = this.snap, W = this.sW, H = this.sH;
    const mask = this.sInv ? 0xFFFF : 0;
    const { w, h } = this.snapSize();
    let o = 0;
    switch (this.sRot) {
      case 0:
        for (let i = 0, n = w * h; i < n; i++) out[i] = lut[s[i] ^ mask];
        break;
      case 1:
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) out[o++] = lut[s[x * W + (W - 1 - y)] ^ mask];
        break;
      case 2:
        for (let i = 0, n = w * h; i < n; i++) out[i] = lut[s[n - 1 - i] ^ mask];
        break;
      default:
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) out[o++] = lut[s[(H - 1 - x) * W + y] ^ mask];
    }
  }

  // ---- command dispatch --------------------------------------------------------
  exec(cmd, p) {
    const n = p.length;
    const need = (k) => { if (n >= k) return true; this.stats.bad++; return false; };
    switch (cmd) {
      case OP.BEGIN: if (need(4)) this.begin(u16(p, 0), u16(p, 2)); break;
      case OP.FILL_SCREEN: if (need(2)) { this.fb.fill(u16(p, 0)); this.dirty = true; } break;
      case OP.FLUSH: this.snapshot(); this._emit('flush'); break;
      case OP.SET_ROTATION: if (need(1)) { this.rot = p[0] & 3; this._layout(); this.dirty = true; this._emit('layout'); } break;
      case OP.INVERT: if (need(1)) { this.inv = p[0] ? 1 : 0; this.dirty = true; } break;
      case OP.CLOSE: this.fb.fill(0); this.dirty = true; this.snapshot(); this._emit('close'); this._emit('flush'); break;
      case OP.TITLE: this._emit('title', new TextDecoder('utf-8').decode(p)); break;
      case OP.CLEAR_BUTTONS: this._emit('clearButtons'); break;
      case OP.ADD_BUTTON:
        if (need(2) && need(2 + p[1])) this._emit('addButton', p[0], new TextDecoder('utf-8').decode(p.subarray(2, 2 + p[1])));
        break;

      case OP.PIXEL: if (need(6)) this.px(i16(p, 0), i16(p, 2), u16(p, 4)); break;
      case OP.LINE: if (need(10)) this.drawLine(i16(p, 0), i16(p, 2), i16(p, 4), i16(p, 6), u16(p, 8)); break;
      case OP.HLINE: if (need(8)) this.hline(i16(p, 0), i16(p, 2), i16(p, 4), u16(p, 6)); break;
      case OP.VLINE: if (need(8)) this.vline(i16(p, 0), i16(p, 2), i16(p, 4), u16(p, 6)); break;
      case OP.RECT: if (need(10)) this.drawRect(i16(p, 0), i16(p, 2), i16(p, 4), i16(p, 6), u16(p, 8)); break;
      case OP.FILL_RECT: if (need(10)) this.fillRect(i16(p, 0), i16(p, 2), i16(p, 4), i16(p, 6), u16(p, 8)); break;
      case OP.ROUNDRECT: if (need(12)) this.drawRoundRect(i16(p, 0), i16(p, 2), i16(p, 4), i16(p, 6), i16(p, 8), u16(p, 10)); break;
      case OP.FILL_ROUNDRECT: if (need(12)) this.fillRoundRect(i16(p, 0), i16(p, 2), i16(p, 4), i16(p, 6), i16(p, 8), u16(p, 10)); break;
      case OP.CIRCLE: if (need(8)) this.drawCircle(i16(p, 0), i16(p, 2), i16(p, 4), u16(p, 6)); break;
      case OP.FILL_CIRCLE: if (need(8)) this.fillCircle(i16(p, 0), i16(p, 2), i16(p, 4), u16(p, 6)); break;
      case OP.TRI: if (need(14)) this.drawTriangle(i16(p, 0), i16(p, 2), i16(p, 4), i16(p, 6), i16(p, 8), i16(p, 10), u16(p, 12)); break;
      case OP.FILL_TRI: if (need(14)) this.fillTriangle(i16(p, 0), i16(p, 2), i16(p, 4), i16(p, 6), i16(p, 8), i16(p, 10), u16(p, 12)); break;

      // NOTE: 0x40 has no colour on the wire, so the current text colour is used (use 0x42 for an explicit colour).
      case OP.BITMAP: if (need(8)) this.drawBitmap(i16(p, 0), i16(p, 2), i16(p, 4), i16(p, 6), p.subarray(8), this.fg, -1); break;
      case OP.BITMAP_BG: if (need(12)) this.drawBitmap(i16(p, 0), i16(p, 2), i16(p, 4), i16(p, 6), p.subarray(12), u16(p, 8), u16(p, 10)); break;

      // Bitmap opcodes 0x42-0x45: header is x,y,w,h (i16 each); the payload must be complete or the frame is rejected.
      //   0x42  u16 colour, then 1-bit data (rows padded to whole bytes, MSB first)
      //   0x43  w*h RGB565 pixels (u16 LE, row-major)
      //   0x44  1-bit mask (same layout as 0x42 data; 1 = draw), then w*h RGB565 pixels
      //   0x45  w*h 8-bit gray pixels, shown as a true gray ramp
      case OP.BITMAP_FG: {
        if (!need(10)) break;
        const w = i16(p, 4), h = i16(p, 6);
        if (w < 1 || h < 1 || !need(10 + ((w + 7) >> 3) * h)) { if (w < 1 || h < 1) this.stats.bad++; break; }
        this.drawBitmap(i16(p, 0), i16(p, 2), w, h, p.subarray(10), u16(p, 8), -1);
        break;
      }
      case OP.RGB_BITMAP: {
        if (!need(8)) break;
        const w = i16(p, 4), h = i16(p, 6);
        if (w < 1 || h < 1) { this.stats.bad++; break; }
        if (need(8 + 2 * w * h)) this.drawRGB(i16(p, 0), i16(p, 2), w, h, p, 8, -1);
        break;
      }
      case OP.RGB_BITMAP_MASK: {
        if (!need(8)) break;
        const w = i16(p, 4), h = i16(p, 6);
        if (w < 1 || h < 1) { this.stats.bad++; break; }
        const mb = ((w + 7) >> 3) * h;
        if (need(8 + mb + 2 * w * h)) this.drawRGB(i16(p, 0), i16(p, 2), w, h, p, 8 + mb, 8);
        break;
      }
      case OP.GRAY_BITMAP: {
        if (!need(8)) break;
        const w = i16(p, 4), h = i16(p, 6);
        if (w < 1 || h < 1) { this.stats.bad++; break; }

document.addEventListener('visibilitychange', () => {
  if (document.hidden) announce(false);
  else { announce(true); send(makeFrame(BC.REDRAW)); }
});

// ---- touch (Pointer Events) ------------------------------------------------------
function mapPoint(e) {
  const r = canvas.getBoundingClientRect();
  if (!r.width || !r.height || !lw) return null;
  const x = Math.floor((e.clientX - r.left) * lw / r.width);
  const y = Math.floor((e.clientY - r.top) * lh / r.height);
  return { x: Math.min(lw - 1, Math.max(0, x)), y: Math.min(lh - 1, Math.max(0, y)),
           inside: e.clientX >= r.left && e.clientX < r.right && e.clientY >= r.top && e.clientY < r.bottom };
}
function sendTouch(cmd, pt) {
  const p = new Uint8Array([pt.x & 255, pt.x >> 8, pt.y & 255, pt.y >> 8, BC.Z_CONTACT]);
  send(makeFrame(cmd, p));
}
function cancelTouch() { clearTimeout(touch.trail); touch.trail = 0; touch.pending = null; touch.id = null; }
function flushPending() {
  clearTimeout(touch.trail); touch.trail = 0;
  if (touch.pending) { sendTouch(BC.TOUCH_MOVE, touch.pending); touch.pending = null; touch.last = performance.now(); }
}
canvas.addEventListener('pointerdown', (e) => {
  if (!touch.on || touch.id !== null) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const pt = mapPoint(e); if (!pt || !pt.inside) return;
  touch.id = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  sendTouch(BC.TOUCH_DOWN, pt);
  touch.last = performance.now(); touch.pending = null;
  e.preventDefault();
});
canvas.addEventListener('pointermove', (e) => {
  if (!touch.on || e.pointerId !== touch.id) return;
  const pt = mapPoint(e); if (!pt) return;
  const now = performance.now(), wait = touch.interval - (now - touch.last);
  if (touch.interval === 0 || wait <= 0) { touch.pending = null; sendTouch(BC.TOUCH_MOVE, pt); touch.last = now; }
  else {
    touch.pending = pt;                                          // throttled: deliver the latest position later
    if (!touch.trail) touch.trail = setTimeout(flushPending, wait);
  }
  e.preventDefault();
});
function endTouch(e) {
  if (e.pointerId !== touch.id) return;
  flushPending();
  touch.id = null;
  send(makeFrame(BC.TOUCH_UP));
}
canvas.addEventListener('pointerup', endTouch);
canvas.addEventListener('pointercancel', endTouch);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

// ---- keyboard shortcuts: 1 / 2 = T1 / T2 -----------------------------------------
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === 'r' || e.key === 'R') { saveCapture(); return; }
  const key = e.key === '1' ? 0xF2 : e.key === '2' ? 0xF3 : 0;
  if (key && buttons[key] != null) send(makeFrame(key));
});

// ---- footer info ------------------------------------------------------------------
let lastBytes = 0, lastFrames = 0, lastT = performance.now();
setInterval(() => {
  const now = performance.now(), dt = (now - lastT) / 1000;
  let s = lw ? lw + '×' + lh + ' · rotation ' + renderer.rot * 90 + '°' : 'no display yet';
  if (cfg.debug) {
    const st = parser.stats;
    s += ' · ' + ((frames - lastFrames) / dt).toFixed(0) + ' fps · ' + ((st.bytes - lastBytes) / dt / 1024).toFixed(1) +
         ' KB/s · rx ' + st.bytes + ' B · cmds ' + st.frames + ' · sync ' + st.syncErrors + ' bad ' + (st.invalid + renderer.stats.bad) +
         ' unknown ' + renderer.stats.unknown;
  }
  $('info').textContent = s;
  lastBytes = parser.stats.bytes; lastFrames = frames; lastT = now;
}, 500);

window.addEventListener('resize', fit);
renderButtons();
connect();
})();
</script>
</body>
</html>
