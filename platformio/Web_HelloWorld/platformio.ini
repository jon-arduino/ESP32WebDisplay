[env:heltec_wifi_lora_32_V3]
platform  = espressif32
board     = heltec_wifi_lora_32_V3
framework = arduino
lib_ldf_mode = deep+

lib_deps =
    symlink://../..                          ; ESP32WebDisplay (this repo, two folders up)
    https://github.com/jon-arduino/ESP32PhoneDisplay.git
    h2zero/NimBLE-Arduino @ 2.3.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO
    ESP32Async/AsyncTCP @ ^3.3.8
    ESP32Async/ESPAsyncWebServer

monitor_speed = 115200
monitor_port = /dev/cu.usbmodem2101
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_LIBDEPS_DIR}/${PIOENV}/NimBLE-Arduino@2.3.9/src
    -I${PROJECT_LIBDEPS_DIR}/${PIOENV}/ESPAsyncWebServer/src
